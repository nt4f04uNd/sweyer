name: sweyer
description: "Open source music player built with Flutter"
homepage: https://github.com/nt4f04uNd/sweyer
repository: https://github.com/nt4f04uNd/sweyer
issue_tracker: https://github.com/nt4f04uNd/sweyer/issues
publish_to: 'none'
version: 1.0.14+17

environment:
  sdk: ^3.6.0
  flutter: 3.35.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  uuid: ^4.6.0
  path: ^1.8.0
  async: ^2.13.1
  rxdart: ^0.28.0
  sliver_tools: ^0.2.1
  animations: ^2.2.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  percent_indicator: ^4.2.5
  # cloud_functions 5.4.0 introduced SPM support and regressed iOS IPA/archive builds.
  # Keep 5.3.4 and Firebase packages compatible with firebase_core_platform_interface ^5
  # until the planned Flutter/SPM migration. See https://github.com/firebase/flutterfire/issues/17248.
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.3.4
  firebase_analytics: ">=11.4.4 <11.5.2"
  cloud_functions: 5.3.4
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.2
  lottie: ^3.3.3
  auto_size_text: ^3.0.0
  marquee: ^2.1.0
  equatable: ^3.0.0
  device_info_plus: ^12.4.0
  sqflite: ^2.0.0+3
  boxy: ^2.3.0
  back_button_interceptor: ^8.0.7
  flutter_sticky_header: ^0.8.0
  palette_generator: ^0.3.3+2  # TODO: Discontinued, replace
  cached_network_image: ^3.0.0
  flutter_cache_manager: ^3.1.1
  clock: ^1.1.0
  styled_text: ^9.0.0
  android_content_provider: ^0.5.2
  collection: ^1.16.0
  theme_tailor_annotation: ^3.1.3
  riverpod: ^3.3.2
  flutter_riverpod: ^3.0.0
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.2
  freezed_annotation: ^3.0.0
  json_annotation: ^4.7.0
  memoize: ^3.0.0
  home_widget: ^0.9.2+1

  # quick_actions: ^0.6.0 # TODO: quick actions are blocked on https://github.com/ryanheise/audio_service/issues/671

  fluttertoast: ^9.0.0
  just_audio: ^0.10.6
  playify:
    git:
      url: https://github.com/nt4f04uNd/playify
      ref: sweyer-ios
    # path: ../playify
  audio_service:
    # Using this branch for custom notifications https://github.com/nt4f04uNd/audio_service/commits/sweyer
    # See https://github.com/ryanheise/audio_service/issues/633

    # path: C:/dev/projects/native/audio_service/audio_service
    # path: /Users/nt4f04und/dev/prj/audio_service/audio_service

    git: 
      url: https://github.com/nt4f04uNd/audio_service
      ref: sweyer
      path: audio_service
  nt4f04unds_widgets:
    # path: c:/dev/projects/native/nt4f04unds_widgets/
    # path: /Users/nt4f04und/dev/prj/nt4f04unds_widgets

    git:
      url: https://github.com/nt4f04uNd/nt4f04unds_widgets
      ref: 7.0.0

  sweyer_plugin:
    path: sweyer_plugin

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.5.4
  flutter_lints: ^6.0.0
  golden_toolkit: ^0.15.0  # TODO: Discontinued, replace
  theme_tailor: ^3.0.3
  freezed: ^3.1.0
  json_serializable: ^6.11.2
  sqflite_common_ffi: ^2.3.7+1
  flutter_native_splash: ^2.4.7

flutter_native_splash:
  android: false
  ios: true
  web: false
  color: "#7C4DFF"
  image: static_assets/edit/logo/logo_foreground.png
  ios_content_mode: scaleAspectFit

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true

  assets:
   - assets/
   - assets/images/
    # Don't include a whole folder here because of the README file
   - assets/animations/play_pause.json
   - assets/animations/checkmark.json

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/manrope-extrabold.ttf
          weight: 800
        - asset: assets/fonts/Manrope/manrope-bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/manrope-semibold.ttf
          weight: 600
    - family:  SweyerIcons
      fonts:
       - asset: assets/fonts/SweyerIcons/SweyerIcons.ttf
